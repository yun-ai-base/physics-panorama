<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="space" cx="50%" cy="46%" r="82%">
      <stop offset="0%" stop-color="#0c1226"/>
      <stop offset="60%" stop-color="#070b1a"/>
      <stop offset="100%" stop-color="#03050d"/>
    </radialGradient>
    <pattern id="stars" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="22" r="1.0" fill="#dde6ff" opacity="0.7"/>
      <circle cx="70" cy="80" r="1.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="110" cy="35" r="0.8" fill="#bcd" opacity="0.6"/>
      <circle cx="40" cy="110" r="0.9" fill="#fff" opacity="0.55"/>
      <circle cx="125" cy="118" r="0.7" fill="#cdd" opacity="0.5"/>
    </pattern>
    <!-- 高密度星场（成员星系），仅在扁盘内可见 -->
    <pattern id="cluster" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="14" r="1.6" fill="#eaf0ff" opacity="0.9"/>
      <circle cx="34" cy="40" r="1.3" fill="#cdd9ff" opacity="0.8"/>
      <circle cx="48" cy="10" r="1.1" fill="#fff" opacity="0.75"/>
      <circle cx="20" cy="52" r="1.4" fill="#dfe8ff" opacity="0.8"/>
      <circle cx="54" cy="50" r="1.0" fill="#bcd" opacity="0.7"/>
    </pattern>
    <radialGradient id="knot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4d6"/>
      <stop offset="55%" stop-color="#ffcf86" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffcf86" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pancake">
      <ellipse cx="800" cy="500" rx="560" ry="230"/>
    </clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#space)"/>
  <rect width="1600" height="1000" fill="url(#stars)"/>

  <!-- 扁盘内的致密成员星系 -->
  <g clip-path="url(#pancake)">
    <rect x="240" y="270" width="1120" height="460" fill="url(#cluster)"/>
    <!-- 中心更密 -->
    <ellipse cx="800" cy="500" rx="320" ry="150" fill="url(#cluster)" opacity="0.7"/>
  </g>

  <!-- 室女座团（亮核，偏左上） -->
  <circle cx="700" cy="470" r="70" fill="url(#knot)"/>
  <circle cx="700" cy="470" r="9" fill="#fff6da"/>

  <!-- 若干较亮成员星系 -->
  <g fill="#ffffff">
    <circle cx="560" cy="520" r="3.0" opacity="0.95"/>
    <circle cx="880" cy="450" r="2.6" opacity="0.9"/>
    <circle cx="980" cy="560" r="2.4" opacity="0.85"/>
    <circle cx="640" cy="600" r="2.2" opacity="0.8"/>
    <circle cx="1040" cy="470" r="2.5" opacity="0.85"/>
    <circle cx="760" cy="380" r="2.0" opacity="0.8"/>
    <circle cx="500" cy="430" r="2.1" opacity="0.8"/>
    <circle cx="1120" cy="540" r="2.0" opacity="0.8"/>
  </g>
</svg>
