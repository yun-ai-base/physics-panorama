<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="woBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#120c26"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <radialGradient id="woCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#fff0c2" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffb24d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woJet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3d0"/>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="woStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#woBg)"/>
  <g fill="url(#woStar)">
    <circle cx="90" cy="80" r="1.5"/><circle cx="200" cy="50" r="1.0"/><circle cx="330" cy="100" r="1.3"/>
    <circle cx="540" cy="60" r="1.2"/><circle cx="660" cy="110" r="1.5"/><circle cx="730" cy="70" r="1.0"/>
    <circle cx="130" cy="510" r="1.3"/><circle cx="280" cy="550" r="1.0"/><circle cx="450" cy="530" r="1.4"/>
    <circle cx="610" cy="550" r="1.5"/><circle cx="710" cy="510" r="1.0"/>
  </g>
  <!-- 向外扩散的喷流（上下两道） -->
  <path d="M400 300 L400 40 L372 70 L400 300 Z" fill="url(#woJet)" opacity="0.9"/>
  <path d="M400 300 L400 40 L428 70 L400 300 Z" fill="url(#woJet)" opacity="0.9"/>
  <path d="M400 300 L400 560 L372 530 L400 300 Z" fill="url(#woJet)" opacity="0.9"/>
  <path d="M400 300 L400 560 L428 530 L400 300 Z" fill="url(#woJet)" opacity="0.9"/>
  <!-- 向外扩散的同心环波 -->
  <circle cx="400" cy="300" r="70" fill="none" stroke="#ffd98a" stroke-width="2" opacity="0.55"/>
  <circle cx="400" cy="300" r="120" fill="none" stroke="#ffd98a" stroke-width="1.6" opacity="0.4"/>
  <circle cx="400" cy="300" r="180" fill="none" stroke="#ffd98a" stroke-width="1.2" opacity="0.28"/>
  <circle cx="400" cy="300" r="250" fill="none" stroke="#ffd98a" stroke-width="1" opacity="0.18"/>
  <!-- 中央白洞亮核 -->
  <circle cx="400" cy="300" r="42" fill="url(#woCore)"/>
  <circle cx="400" cy="300" r="42" fill="none" stroke="#fff6dd" stroke-width="2" opacity="0.9"/>
</svg>
