<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="space" cx="50%" cy="46%" r="82%">
      <stop offset="0%" stop-color="#0c1226"/>
      <stop offset="60%" stop-color="#070b1a"/>
      <stop offset="100%" stop-color="#03050d"/>
    </radialGradient>
    <pattern id="stars" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="22" r="1.0" fill="#dde6ff" opacity="0.7"/>
      <circle cx="70" cy="80" r="1.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="110" cy="35" r="0.8" fill="#bcd" opacity="0.6"/>
      <circle cx="40" cy="110" r="0.9" fill="#fff" opacity="0.55"/>
      <circle cx="125" cy="118" r="0.7" fill="#cdd" opacity="0.5"/>
    </pattern>
    <radialGradient id="bulge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="32%" stop-color="#ffd278" stop-opacity="0.95"/>
      <stop offset="68%" stop-color="#e8a94e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8a94e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="armglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9fc0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9fc0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#space)"/>
  <rect width="1600" height="1000" fill="url(#stars)"/>

  <!-- 旋臂（两条，蓝白发光） -->
  <g filter="url(#soft)" opacity="0.9">
    <path d="M800 500 C 1000 415, 1230 455, 1300 665 C 1352 815, 1180 915, 985 905 C 1160 815, 1130 615, 870 555 Z" fill="url(#armglow)"/>
    <path d="M800 500 C 600 415, 370 455, 300 665 C 248 815, 420 915, 615 905 C 440 815, 470 615, 730 555 Z" fill="url(#armglow)"/>
  </g>

  <!-- 尘埃暗带 -->
  <g fill="none" stroke="#160f22" stroke-opacity="0.5" stroke-width="16">
    <path d="M825 500 C 1000 445, 1170 480, 1255 650"/>
    <path d="M775 500 C 600 445, 430 480, 345 650"/>
  </g>

  <!-- 中央核球（棒旋） -->
  <ellipse cx="800" cy="500" rx="155" ry="60" fill="url(#bulge)" transform="rotate(-18 800 500)"/>
  <ellipse cx="800" cy="500" rx="62" ry="48" fill="#fff6d8"/>

  <!-- 沿旋臂散布亮星 -->
  <g fill="#ffffff">
    <circle cx="985" cy="470" r="2.4" opacity="0.95"/>
    <circle cx="1120" cy="520" r="1.9" opacity="0.85"/>
    <circle cx="1235" cy="640" r="2.1" opacity="0.9"/>
    <circle cx="1180" cy="780" r="1.7" opacity="0.8"/>
    <circle cx="1010" cy="870" r="2.0" opacity="0.85"/>
    <circle cx="880" cy="650" r="1.6" opacity="0.75"/>
    <circle cx="615" cy="470" r="2.4" opacity="0.95"/>
    <circle cx="480" cy="520" r="1.9" opacity="0.85"/>
    <circle cx="365" cy="640" r="2.1" opacity="0.9"/>
    <circle cx="420" cy="780" r="1.7" opacity="0.8"/>
    <circle cx="590" cy="870" r="2.0" opacity="0.85"/>
    <circle cx="720" cy="650" r="1.6" opacity="0.75"/>
    <circle cx="800" cy="360" r="1.8" opacity="0.8"/>
    <circle cx="800" cy="640" r="1.8" opacity="0.8"/>
  </g>
</svg>
