<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="space" cx="50%" cy="46%" r="82%">
      <stop offset="0%" stop-color="#0c1226"/>
      <stop offset="60%" stop-color="#070b1a"/>
      <stop offset="100%" stop-color="#03050d"/>
    </radialGradient>
    <pattern id="stars" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="22" r="1.0" fill="#dde6ff" opacity="0.7"/>
      <circle cx="70" cy="80" r="1.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="110" cy="35" r="0.8" fill="#bcd" opacity="0.6"/>
      <circle cx="40" cy="110" r="0.9" fill="#fff" opacity="0.55"/>
      <circle cx="125" cy="118" r="0.7" fill="#cdd" opacity="0.5"/>
    </pattern>
    <radialGradient id="attractor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0c0"/>
      <stop offset="40%" stop-color="#ff9d5c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff7a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="filament" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7d6bd6" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#9b86e8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff9d5c" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#space)"/>
  <rect width="1600" height="1000" fill="url(#stars)"/>

  <!-- 宇宙纤维（多条，由边缘汇入巨引源） -->
  <g filter="url(#soft)" fill="none" stroke="url(#filament)" stroke-width="10" opacity="0.9">
    <path d="M120 120 C 420 260, 620 360, 800 510"/>
    <path d="M1480 140 C 1160 280, 1000 380, 820 510"/>
    <path d="M90 880 C 380 720, 600 620, 790 520"/>
    <path d="M1500 860 C 1200 700, 1000 600, 830 520"/>
    <path d="M800 60 C 800 220, 800 340, 805 500"/>
    <path d="M820 950 C 815 760, 810 640, 808 530"/>
  </g>
  <g fill="none" stroke="#b9a6f2" stroke-width="1.4" opacity="0.5">
    <path d="M120 120 C 420 260, 620 360, 800 510"/>
    <path d="M1480 140 C 1160 280, 1000 380, 820 510"/>
    <path d="M90 880 C 380 720, 600 620, 790 520"/>
    <path d="M1500 860 C 1200 700, 1000 600, 830 520"/>
  </g>

  <!-- 纤维上的星系团节点 -->
  <g fill="#e7ddff">
    <circle cx="430" cy="280" r="4.5" opacity="0.9"/>
    <circle cx="1180" cy="300" r="4.0" opacity="0.85"/>
    <circle cx="380" cy="720" r="4.2" opacity="0.85"/>
    <circle cx="1200" cy="700" r="3.8" opacity="0.8"/>
    <circle cx="800" cy="230" r="3.6" opacity="0.8"/>
    <circle cx="800" cy="780" r="3.4" opacity="0.75"/>
    <circle cx="610" cy="400" r="3.0" opacity="0.75"/>
    <circle cx="1000" cy="430" r="3.0" opacity="0.75"/>
  </g>

  <!-- 巨引源（汇聚中心，发光橙核） -->
  <circle cx="805" cy="515" r="120" fill="url(#attractor)"/>
  <circle cx="805" cy="515" r="16" fill="#fff1cf"/>
</svg>
