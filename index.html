<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>物理学全景图 · Physics Panorama</title>
  <meta name="description" content="将物理学 300+ 年的演化路径可视化为一张可交互、可探索的全景图谱。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%23B8893B' stroke-width='3'/></svg>" />
  <!-- KaTeX（公式渲染，CDN 引入；加载失败时自动回退为原始 LaTeX 文本，不影响其余功能） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/timeline.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/tour.css" />
  <link rel="stylesheet" href="css/mindmap.css" />
</head>
<body>
  <div id="app">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand-row">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__title">物理学全景图</span>
          <span class="brand__sub">Physics Panorama</span>
        </div>
      </div>
      <div class="nav-row">
        <nav class="views" id="viewTabs" aria-label="视图切换">
          <button class="view-tab" data-view="timeline">时间线</button>
          <button class="view-tab" data-view="unification">统一之路</button>
          <button class="view-tab" data-view="scale">尺度维度</button>
          <button class="view-tab" data-view="people">人物索引</button>
          <button class="view-tab" data-view="void">虚无-图景</button>
        </nav>
        <div class="search" id="searchBox">
          <input id="searchInput" type="search" placeholder="搜索学说 / 人名 / 关键词…" autocomplete="off" />
          <div class="search__results" id="searchResults" hidden></div>
        </div>
        <button class="lang-toggle" id="langBtn" type="button">EN</button>
      </div>
    </header>

    <!-- 纪元导航 -->
    <div class="era-nav" id="eraNav">
      <div class="era-tabs" id="eraTabs"></div>
      <label class="only-core">
        <input type="checkbox" id="onlyCore" checked />
        <span>仅显示主干</span>
      </label>
    </div>

    <!-- 尺度维度关联图（仅在尺度视图显示） -->
    <div class="scale-map-bar" id="scaleMapBar" hidden>
      <div class="scale-map-bar__chain">
        <button class="scale-map-bar__chip" data-scale="microscopic" style="--tag:#6B489E">微观</button>
        <span class="scale-map-bar__arrow" data-scale="microscopic" data-rel="微观 → 宏观 · 涌现">涌现</span>
        <button class="scale-map-bar__chip" data-scale="mesoscopic" style="--tag:#A07840">宏观</button>
        <span class="scale-map-bar__arrow" data-scale="mesoscopic" data-rel="宏观 ↔ 宇观 · 引力桥梁">引力桥梁</span>
        <button class="scale-map-bar__chip" data-scale="cosmic" style="--tag:#41518F">宇观</button>
        <span class="scale-map-bar__arrow" data-scale="unified" data-rel="统一 → 宇观">大统一</span>
        <button class="scale-map-bar__chip" data-scale="unified" style="--tag:#28684E">统一</button>
        <span class="scale-map-bar__arrow" data-scale="unified" data-rel="统一 → 反哺">技术回流</span>
        <button class="scale-map-bar__chip" data-scale="feedback" style="--tag:#6B4E8C">反哺</button>
        <span class="scale-map-bar__arrow scale-map-bar__arrow--loop" data-scale="feedback" data-rel="反哺 ← 微观">↺ 闭环</span>
      </div>
    </div>

    <!-- 主舞台 -->
    <main class="stage-wrap">
      <div class="stage" id="stage">
        <svg id="panorama" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
          <defs>
            <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#B8893B" flood-opacity="0.55" />
            </filter>
            <!-- 冲突边：湍流位移制造"波浪纹"（设计 2.5「灰红波纹」） -->
            <filter id="wave" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="turbulence" baseFrequency="0.012 0.05" numOctaves="2" seed="7" result="n" />
              <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <!-- 纪元背景渐变光晕（边缘透明→中心实色，相邻纪元自然融合，设计 4.1「渐变光晕过渡」） -->
            <linearGradient id="eraGrad-classical" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#C29A4E" stop-opacity="0" /><stop offset="50%" stop-color="#C29A4E" stop-opacity="0.9" /><stop offset="100%" stop-color="#C29A4E" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="eraGrad-relativity" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#41518F" stop-opacity="0" /><stop offset="50%" stop-color="#41518F" stop-opacity="0.9" /><stop offset="100%" stop-color="#41518F" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="eraGrad-quantum" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#7A5BA6" stop-opacity="0" /><stop offset="50%" stop-color="#7A5BA6" stop-opacity="0.9" /><stop offset="100%" stop-color="#7A5BA6" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="eraGrad-standard-model" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#357A5E" stop-opacity="0" /><stop offset="50%" stop-color="#357A5E" stop-opacity="0.9" /><stop offset="100%" stop-color="#357A5E" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="eraGrad-frontier" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#6B4E8C" stop-opacity="0" /><stop offset="50%" stop-color="#6B4E8C" stop-opacity="0.9" /><stop offset="100%" stop-color="#6B4E8C" stop-opacity="0" />
            </linearGradient>
          </defs>
          <g id="viewport">
            <g id="layer-era"></g>
            <g id="layer-edges"></g>
            <g id="layer-nodes"></g>
            <g id="layer-scale-labels"></g>
          </g>
        </svg>
        <div class="hint" id="zoomHint">拖拽/单指平移 · 滚轮/双指缩放 · 点击深入 · Esc 返回</div>
      </div>

      <!-- 手机端 <480px 竖排卡片列表（默认 hidden，仅超小屏显示，设计 4.4） -->
      <div class="mobile-list" id="mobileList" hidden></div>

      <!-- 人物索引视图（覆盖层） -->
      <div class="people-view" id="peopleView" hidden>
        <div class="people-view__head">
          <h2>人物索引</h2>
          <p class="people-view__sub">物理学三百年的代表人物 · 点击查看其关联的学说与事件</p>
          <div class="people-tools">
            <input id="peopleSearch" class="people-search" type="search" placeholder="搜索人物姓名…" aria-label="搜索人物">
            <span class="people-count" id="peopleCount" aria-live="polite" role="status"></span>
          </div>
        </div>
        <div class="people-grid" id="peopleGrid"></div>
      </div>

      <!-- 纪元序言卡（覆盖层，纯新增，不影响现有视图与交互） -->
      <div class="era-preface" id="eraPreface" hidden>
        <div class="era-preface__card">
          <button class="era-preface__close" id="eraPrefaceClose" aria-label="关闭">×</button>
          <div class="era-preface__tag" id="epTag"></div>
          <h2 class="era-preface__title" id="epTitle"></h2>
          <p class="era-preface__lead" id="epLead"></p>
          <div class="era-preface__row"><span class="era-preface__label">核心难题</span><span class="era-preface__val" id="epPuzzle"></span></div>
          <div class="era-preface__row"><span class="era-preface__label">代表人物</span><span class="era-preface__val" id="epFigs"></span></div>
        </div>
      </div>

      <!-- 悬停节点迷你预览卡（纯新增，pointer-events:none 不干扰拖拽/点击） -->
      <div class="node-preview" id="nodePreview" hidden></div>

      <!-- 虚无-图景视图（含「意境」与「思维导图」两个子选项） -->
      <div class="void-view" id="voidView" hidden>
        <div class="void-subtabs" id="voidSubtabs">
          <button class="void-subtab is-active" data-void="poem" type="button">意境</button>
          <button class="void-subtab" data-void="mindmap" type="button">思维导图</button>
        </div>

        <!-- 选项一：意境（原诗意占位） -->
        <div class="void-poem" id="voidPoem">
          <div class="void-view__watermark" aria-hidden="true">
            <span>无极生太极</span>
            <span>太极生两仪</span>
            <span>两仪生四象</span>
            <span>四象生八卦</span>
          </div>
          <div class="void-view__watermark void-view__watermark--left" aria-hidden="true">
            <span>小径分叉的花园</span>
            <span>过去、现在、未来同存</span>
          </div>
          <div class="void-view__card">
            <p class="void-view__verse">一花一世界</p>
            <p class="void-view__verse">一沙一天国</p>
            <p class="void-view__verse">君掌盛无边</p>
            <p class="void-view__verse">刹那含永劫</p>
            <span class="void-view__sub">—— 虚无 · 图景 · 暂居</span>
          </div>
        </div>

        <!-- 选项二：思维导图 -->
        <div class="void-mindmap" id="voidMindmap" hidden>
          <div class="mindmap-toolbar">
            <span class="mindmap-legend">
              <span class="lg"><i style="border-top-color:#C0392B;border-top-style:dashed"></i>范式革命</span>
              <span class="lg"><i style="border-top-color:#E67E22;border-top-style:dashed"></i>理论冲突</span>
              <span class="lg"><i style="border-top-color:#C9A24E"></i>继承脉络</span>
              <span class="lg"><i style="border-top-color:#2E8B57"></i>统一 / 分支</span>
            </span>
            <label class="mindmap-toggle"><input type="checkbox" id="mmExpandAll" /> 展开全部维度</label>
            <button class="mindmap-reset" id="mmReset" type="button">重置视图</button>
            <button class="mindmap-fullscreen" id="mmFullscreen" type="button" title="全屏模式">⛶ 全屏</button>
          </div>
          <svg class="mindmap-svg" id="mindmapSvg" xmlns="http://www.w3.org/2000/svg">
            <g id="mmViewport"></g>
          </svg>
        </div>
      </div>

      <!-- 详情侧边栏 -->
      <aside class="sidebar" id="sidebar" aria-hidden="true">
        <button class="sidebar__close" id="sidebarClose" aria-label="关闭">×</button>
        <div class="sidebar__minimap" id="minimap" hidden></div>
        <div class="sidebar__body" id="sidebarBody"></div>
      </aside>
    </main>

    <!-- 底栏 -->
    <footer class="bottombar">
      <div class="bottombar__links">
        <button class="linkbtn" id="shareBtn">分享当前视图</button>
        <button class="linkbtn" id="expandAllBtn">展开全部关联</button>
        <button class="linkbtn" id="resetBtn">回到全景</button>
          <button class="linkbtn" id="favBtn">★ 收藏 <span id="favCount" class="badge">0</span></button>
          <button class="linkbtn" id="pathBtn">🧭 学习路径</button>
        </div>
      <div class="bottombar__tour">
        <button class="tour-btn" id="tour3">3 分钟概览</button>
        <button class="tour-btn" id="tour10">10 分钟全览</button>
      </div>
    </footer>

    <!-- 更新日记（角落低调入口） -->
    <div class="changelog" id="changelog">
      <button class="changelog__toggle" id="clToggle" type="button" aria-label="更新日记" title="更新日记" aria-expanded="false">
        <span class="changelog__dot"></span>
      </button>
      <div class="changelog__panel" id="clPanel" hidden>
        <div class="changelog__head">
          <span>更新日记</span>
          <button class="changelog__close" id="clClose" type="button" aria-label="收起">×</button>
        </div>
        <div class="changelog__list" id="clList"></div>
      </div>
    </div>
    <!-- 我的收藏（仅本机 localStorage，不上网） -->
    <div class="fav-panel" id="favPanel" hidden>
      <div class="fav-panel__head"><span>★ 我的收藏</span><button class="fav-panel__close" id="favClose" type="button" aria-label="收起">×</button></div>
      <div class="fav-panel__list" id="favList"></div>
    </div>
    <!-- 预设学习路径 -->
    <div class="path-panel" id="pathPanel" hidden>
      <div class="path-panel__head"><span>🧭 预设学习路径</span><button class="path-panel__close" id="pathClose" type="button" aria-label="收起">×</button></div>
      <div class="path-panel__list" id="pathList"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script defer src="js/changelog.js"></script>
</body>
</html>
